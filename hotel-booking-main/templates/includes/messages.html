{% if messages %}<div class="toast-stack" data-toast-stack aria-live="polite" aria-relevant="additions removals" aria-atomic="false">{% for message in messages %}<div class="site-toast toast-{{ message.tags|default:'info' }}" data-toast data-level="{{ message.tags|default:'info' }}" role="{% if message.tags == 'error' or message.tags == 'warning' %}alert{% else %}status{% endif %}"><span class="toast-icon"><i class="bi {% if message.tags == 'success' %}bi-check-circle{% elif message.tags == 'error' %}bi-exclamation-octagon{% elif message.tags == 'warning' %}bi-exclamation-triangle{% else %}bi-info-circle{% endif %}" aria-hidden="true"></i></span><span class="toast-copy">{{ message }}</span><button class="toast-dismiss" type="button" data-toast-dismiss aria-label="Dismiss notification"><i class="bi bi-x-lg" aria-hidden="true"></i></button></div>{% endfor %}</div>{% endif %}
